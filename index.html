<!DOCTYPE html>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    :root {
      --primary-color: #1d3557;
      --accent-color: #e63946;
      --bg-color: #f8f9fa;
      --border-color: #dee2e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 10px;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 5px;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 15px;
      font-size: 12px;
    }

    .search-bar {
      margin-bottom: 15px;
      text-align: center;
    }

    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    .table-responsive {
      width: 100%;
      overflow-x: hidden;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 6px 4px;
      text-align: left;
      font-size: 11px;
      word-wrap: break-word;
    }

    /* Adjusted column widths to fit the screen without horizontal scrolling */
    th:nth-child(1), td:nth-child(1) { width: 8%; text-align: center; }  /* S.No */
    th:nth-child(2), td:nth-child(2) { width: 33%; } /* Product Name */
    th:nth-child(3), td:nth-child(3) { width: 12%; } /* Unit */
    th:nth-child(4), td:nth-child(4) { width: 13%; } /* Disc. Price */
    th:nth-child(5), td:nth-child(5) { width: 18%; } /* Quantity */
    th:nth-child(6), td:nth-child(6) { width: 16%; } /* Subtotal */

    th {
      background-color: var(--primary-color);
      color: white;
      font-size: 11px;
    }

    .category-header {
      background-color: #e2e8f0;
      font-weight: bold;
      color: var(--primary-color);
      text-transform: uppercase;
      font-size: 11px;
    }

    .qty-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .btn-qty {
      background-color: #e2e8f0;
      border: 1px solid #cbd5e1;
      padding: 2px 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 3px;
      font-size: 11px;
    }

    .btn-qty:hover {
      background-color: #cbd5e1;
    }

    .qty-input {
      width: 26px;
      text-align: center;
      padding: 2px;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      font-size: 11px;
    }

    .summary-box {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .summary-item {
      font-size: 13px;
    }

    .summary-item span {
      font-weight: bold;
      color: var(--primary-color);
    }

    .order-btn {
      display: block;
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .order-btn:hover {
      background-color: #20ba5a;
    }

    .discount-price {
      color: var(--accent-color);
      font-weight: bold;
    }

    @media (min-width: 768px) {
      body { padding: 20px; }
      .container { padding: 20px; }
      h1 { font-size: 28px; }
      .subtitle { font-size: 14px; }
      th, td { padding: 10px; font-size: 14px; }
      .qty-input { width: 45px; font-size: 14px; }
      .btn-qty { padding: 4px 8px; font-size: 14px; }
      .summary-item { font-size: 15px; }
    }
  </style>
</head>

    const quantities = {};

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      rawData.forEach(item => {
        if (item.category) {
          const catRow = document.createElement('tr');
          catRow.className = 'category-header';
          catRow.innerHTML = `<td colspan="6">${item.category}</td>`;
          tbody.appendChild(catRow);
        } else {
          const row = document.createElement('tr');
          row.setAttribute('data-name', item.name.toLowerCase());
          row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.unit}</td>
            <td class="discount-price">₹${item.disc.toFixed(0)}</td>
            <td>
              <div class="qty-control">
                <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
                <input type="number" id="qty-input-${item.id}" min="0" value="${quantities[item.id] || 0}" class="qty-input" onchange="updateQty(${item.id}, this.value)" oninput="updateQty(${item.id}, this.value)">
                <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
              </div>
            </td>
            <td class="subtotal" id="subtotal-${item.id}">₹0</td>
          `;
          tbody.appendChild(row);
        }
      });
    }

    function changeQty(id, delta) {
      const currentQty = quantities[id] || 0;
      const newQty = Math.max(0, currentQty + delta);
      const inputElem = document.getElementById(`qty-input-${id}`);
      if (inputElem) {
        inputElem.value = newQty;
      }
      updateQty(id, newQty);
    }

    function updateQty(id, qty) {
      const parsedQty = parseInt(qty) || 0;
      quantities[id] = parsedQty < 0 ? 0 : parsedQty;
      
      const item = rawData.find(i => i.id === id);
      if (item) {
        const subtotal = quantities[id] * item.disc;
        const subtotalElem = document.getElementById(`subtotal-${id}`);
        if (subtotalElem) {
          subtotalElem.innerText = `₹${subtotal.toFixed(0)}`;
        }
      }
      calculateTotals();
    }

    function calculateTotals() {
      let totalQty = 0;
      let grandTotal = 0;

      rawData.forEach(item => {
        if (item.id && quantities[item.id]) {
          const q = quantities[item.id];
          totalQty += q;
          grandTotal += q * item.disc;
        }
      });

      document.getElementById('totalItems').innerText = totalQty;
      document.getElementById('grandTotal').innerText = `₹${grandTotal.toFixed(2)}`;
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');

      rows.forEach(row => {
        if (row.classList.contains('category-header')) {
          row.style.display = '';
        } else {
          const name = row.getAttribute('data-name');
          if (name && name.includes(query)) {
            row.style.display = '';
          } else {
            row.style.display = 'none';
          }
        }
      });
    }

    function generatePDFAndOrderWhatsApp() {
      let hasItems = false;
      const selectedItems = [];
      let grandTotal = 0;

      let orderText = "Hello Cosmic Crackers, I have placed an order and generated my bill PDF.\n\nOrder Summary:\n";

      rawData.forEach(item => {
        if (item.id && quantities[item.id] > 0) {
          hasItems = true;
          const q = quantities[item.id];
          const subtotal = q * item.disc;
          grandTotal += subtotal;

          orderText += `• ${item.name} (${item.unit}) x ${q} = ₹${subtotal.toFixed(2)}\n`;

          selectedItems.push([
            item.id.toString(),
            item.name,
            item.unit,
            `Rs. ${item.disc.toFixed(2)}`,
            q.toString(),
            `Rs. ${subtotal.toFixed(2)}`
          ]);
        }
      });

      if (!hasItems) {
        alert("Please select at least one item before ordering.");
        return;
      }

      orderText += `\nGrand Total: ₹${grandTotal.toFixed(2)}`;
      orderText += `\n\n(PDF Bill generated)`;

      // 1. Generate PDF
      const { jsPDF } = window.jspdf;
      if (jsPDF) {
        const doc = new jsPDF();

        // Header Banner
        doc.setFillColor(29, 53, 87);
        doc.rect(0, 0, 210, 35, 'F');

        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.setTextColor(255, 183, 3);
        doc.text("COSMIC CRACKERS", 105, 14, { align: "center" });

        doc.setFontSize(9);
        doc.setTextColor(255, 255, 255);
        doc.text("Sivakasi Wholesale Price List - Estimate Invoice", 105, 22, { align: "center" });
        doc.text("Call / WhatsApp: +91 8667784874", 105, 28, { align: "center" });

        // Invoice Metadata
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 42);
        doc.text("Status: Order Invoice", 150, 42);

        // Table generation
        if (typeof doc.autoTable === "function") {
          doc.autoTable({
            startY: 48,
            head: [['S.No', 'Product Name', 'Unit', 'Disc. Price', 'Qty', 'Subtotal']],
            body: selectedItems,
            headStyles: { fillColor: [33, 37, 41], textColor: [255, 255, 255], fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [248, 249, 250] },
            styles: { fontSize: 8, cellPadding: 2.5 }
          });
        }

        const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY : 50;

        // Totals Section
        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(217, 4, 41);
        doc.text(`Grand Total: Rs. ${grandTotal.toFixed(2)}`, 14, finalY + 16);

        doc.setFont("helvetica", "italic");
        doc.setFontSize(8);
        doc.setTextColor(100, 100, 100);
        doc.text("Thank you for choosing Cosmic Crackers! Happy Diwali!", 105, finalY + 26, { align: "center" });

        // Safe mobile vs desktop output handling
        const pdfBlob = doc.output('blob');
        const blobUrl = URL.createObjectURL(pdfBlob);
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile) {
          window.open(blobUrl, '_blank');
        } else {
          doc.save("Cosmic_Crackers_Invoice.pdf");
        }
      }

      // 2. Open WhatsApp after a short delay
      setTimeout(() => {
        const encodedText = encodeURIComponent(orderText);
        const whatsappUrl = `https://wa.me/918667784874?text=${encodedText}`;
        window.location.href = whatsappUrl;
      }, 500);
    }

    renderTable();
  </script>
</body>
</html>
