    const quantities = {};

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      rawData.forEach(item => {
        if (item.category) {
          const catRow = document.createElement('tr');
          catRow.className = 'category-header';
          catRow.innerHTML = `<td colspan="7">${item.category}</td>`;
          tbody.appendChild(catRow);
        } else {
          const row = document.createElement('tr');
          row.setAttribute('data-name', item.name.toLowerCase());
          row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>${item.unit}</td>
            <td class="actual-price">₹${item.actual.toFixed(2)}</td>
            <td class="discount-price">₹${item.disc.toFixed(2)}</td>
            <td>
              <input type="number" min="0" value="${quantities[item.id] || 0}" class="qty-input" onchange="updateQty(${item.id}, this.value)" oninput="updateQty(${item.id}, this.value)">
            </td>
            <td class="subtotal" id="subtotal-${item.id}">₹0.00</td>
          `;
          tbody.appendChild(row);
        }
      });
    }

    function updateQty(id, qty) {
      const parsedQty = parseInt(qty) || 0;
      quantities[id] = parsedQty < 0 ? 0 : parsedQty;
      
      const item = rawData.find(i => i.id === id);
      if (item) {
        const subtotal = quantities[id] * item.disc;
        const subtotalElem = document.getElementById(`subtotal-${id}`);
        if (subtotalElem) {
          subtotalElem.innerText = `₹${subtotal.toFixed(2)}`;
        }
      }
      calculateTotals();
    }

    function calculateTotals() {
      let totalQty = 0;
      let grandTotal = 0;
      let totalActual = 0;

      rawData.forEach(item => {
        if (item.id && quantities[item.id]) {
          const q = quantities[item.id];
          totalQty += q;
          grandTotal += q * item.disc;
          totalActual += q * item.actual;
        }
      });

      const totalSavings = totalActual - grandTotal;

      document.getElementById('totalItems').innerText = totalQty;
      document.getElementById('grandTotal').innerText = `₹${grandTotal.toFixed(2)}`;
      document.getElementById('totalSavings').innerText = `₹${totalSavings.toFixed(2)}`;
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');

      rows.forEach(row => {
        if (row.classList.contains('category-header')) {
          row.style.display = '';
        } else {
          const name = row.getAttribute('data-name');
          if (name && name.includes(query)) {
            row.style.display = '';
          } else {
            row.style.display = 'none';
          }
        }
      });
    }

    function sendWhatsAppOrder() {
      let orderText = "Hello Cosmic Crackers, I would like to place an order:\n\n";
      let hasItems = false;
      let grandTotal = 0;

      rawData.forEach(item => {
        if (item.id && quantities[item.id] > 0) {
          hasItems = true;
          const q = quantities[item.id];
          const subtotal = q * item.disc;
          grandTotal += subtotal;
          orderText += `• ${item.name} (${item.unit}) x ${q} = ₹${subtotal.toFixed(2)}\n`;
        }
      });

      if (!hasItems) {
        alert("Please select at least one item before ordering.");
        return;
      }

      orderText += `\n*Grand Total: ₹${grandTotal.toFixed(2)}*`;
      const encodedText = encodeURIComponent(orderText);
      window.open(`https://wa.me/918667784874?text=${encodedText}`, '_blank');
    }

    // Initialize
    renderTable();
  </script>
</body>
</html>
